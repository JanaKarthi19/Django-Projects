{% extends "base/base.html" %}

{% load static %}

{% block title %}Login{% endblock %}

{% block content %}

    <div id="login_container">
        <div id="login_first_box">
            <h1>Login</h1>
        </div>
        <div id="login_second_box">
            <form action="accessing" method="POST">
                {% csrf_token %}
                <label for="">Username:</label><br>
                <input type="text" name="log_name" id="" required>
                <br>
                <br>
                <label for="">Password:</label><br>
                <input type="password" name="log_pass" id="log_pass" pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@#$!%&*]).{8,16}$" title="Password must be 8 to 16 characters long" required>
                <input type="checkbox" name="" id="show_pass">Show Password
                <br>
                <br>
                <input type="submit" value="Login" id="login_btn">
            </form>
            <br>
            <p>Don't have an account? <a href="register">Register</a></p>
        </div>
    </div>

{% endblock %} 

{% block scripts %}

<script src="{% static 'JS/script.js' %}"></script>

{% endblock %}
