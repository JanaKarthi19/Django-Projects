{% extends "base/base.html" %}

{% load static %}

{% block title %} Edit List {% endblock %}

{% block content %}

    <div id="add_container">
        <div id="add_first_box">
            <a href="{% url 'Home_page' user.id %}"><h3>Back</h3></a>
        </div>
        <div id="add_second_box">
            <form action="{% url 'edited_todo' todo.id user.id %}" method="POST">
                {% csrf_token %}
                <br>
                <label><h4>Title:</h4></label>
                <input type="text" name="update_li_title" value="{{ todo.title }}">
                <br>
                <br>
                <label for=""><h4>Description:</h4></label>
                <textarea id="" name="update_li_desc" style="width:400px; height:150px;">{{ todo.description }}</textarea>
                <br>
                <br>
                <label for=""><h4>Completed:</h4></label><br>
                <input type="checkbox" name="update_li_status" {% if todo.Completed %}Checked{% endif %}>
                <br>
                <br>
                <center><input type="submit" value="Save"></center>
                <br>
            </form>
        </div>
        <h2>{{ error }}</h2>
        <br>
    </div>


{% endblock content %}
